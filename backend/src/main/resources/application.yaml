spring:
  session:
    store-type: mongodb
  data:
    mongodb:
      uri: mongodb://localhost:27017/triviatrove


server:
    port: 8080
    compression:
        enabled: true
    error:
        include-message: always
    shutdown: "graceful"
    servlet:
      session:
        timeout: 30m # 30 minute

data:
  initializer:
    enabled: false

trivia: 
  api:
    url: https://opentdb.com/api.php

logging:
  level:
    '[org.springframework.security]': DEBUG
    '[org.springframework.web]': DEBUG
    '[org.springframework.session]': DEBUG
